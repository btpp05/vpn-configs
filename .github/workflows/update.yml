name: VPN Configs Auto-Update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 */3 * *'   # 每 3 天 UTC 2:00

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: 🐍 更新 VPN 配置
        run: |
          python3 update_vpns.py

      - name: 📤 提交更新
        run: |
          git config user.name "VPN Auto-Update Bot"
          git config user.email "bot@users.noreply.github.com"
          git add configs/
          git diff --staged --quiet || (git commit -m "auto: update VPN configs $(date +%Y-%m-%d)" && git push)